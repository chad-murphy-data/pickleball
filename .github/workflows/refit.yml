# Weekly v2 refit.
#
# Deliberately NOT part of the nightly site build. Two reasons:
#
#  1. v2's dynamic skill lives on a MONTHLY grid (model/fit_v2.py: month_idx,
#     tau ~ 0.038/month), and value_now is the final month's bucket. A daily
#     refit cannot produce sub-monthly movement — it just re-estimates the
#     current month with a few more games. The resolution isn't there.
#  2. It's a 600/600 NUTS sample over ~39k games. The nightly harvest already
#     runs long; bolting this on would make a fast path slow for no gain.
#
# Weekly on Monday catches the weekend's MLP/PPA events, which is when new
# games actually arrive. The thing that genuinely decays is COVERAGE, not
# drift: players who debut between refits have no rating at all.
#
# Run manually any time with workflow_dispatch (e.g. mid-event).
name: refit

on:
  schedule:
    - cron: "40 10 * * 1"   # Mondays, 10:40 UTC — after the nightly refresh
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refit
  cancel-in-progress: false

jobs:
  refit:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install model deps
        run: pip install numpy scipy "jax[cpu]" numpyro

      - name: Rebuild model tables + refit v2
        env:
          # 600/600 (the script default) does NOT converge on the full joint
          # panel: it returned sd_d r_hat 1.2330 on 2026-09-02. sd_d is weakly
          # identified by construction -- chemistry is tiny and no pair is
          # certifiable (finding 2) -- so its posterior is a diffuse ridge that
          # short chains settle on differently. The model is already
          # non-centered, so there is no funnel left to reparameterise away;
          # the only lever is draws. ~4.8 s/iter => 2000 iters ~= 2.7 h.
          SRM2_WARMUP: "1200"
          SRM2_SAMPLES: "800"
        run: |
          DATE_FROM=2026-01-01 python scraper/build_model_data.py
          python model/fit_v2.py

      - name: Sanity guard (refuse to commit a broken fit)
        run: |
          python - <<'PY'
          import csv, json, sys
          rows = list(csv.DictReader(open("data/v2_players.csv")))
          fit  = json.load(open("model/v2_fit_summary.json"))
          n    = len(rows)
          rhat_v0 = fit.get("max_rhat_v0", 99)
          print(f"players={n}  divergences={fit.get('n_divergences')}  max_rhat_v0={rhat_v0:.4f}")

          fail, warn = [], []
          if n < 3000:
              fail.append(f"only {n} players in the fit")
          if rhat_v0 > 1.05:
              fail.append(f"max_rhat_v0 {rhat_v0:.4f} > 1.05")

          # Scalars matter too: sd_d drives the pair-chemistry the site renders
          # (web/sitelib/data.py). An earlier version of this guard checked only
          # max_rhat_v0 and would have passed a fit whose sd_d r_hat was 1.23.
          for k, v in fit["scalars"].items():
              r = v.get("r_hat")
              if isinstance(r, list) or r is None:
                  continue
              print(f"  {k:10s} mean {v['mean']:+.4f}  r_hat {r:.4f}")
              if r > 1.10:
                  fail.append(f"{k} r_hat {r:.4f} > 1.10")
              elif r > 1.05:
                  warn.append(f"{k} r_hat {r:.4f}")

          for w in warn:
              print(f"::warning::marginal convergence: {w}")
          if fail:
              sys.exit("FAIL: " + "; ".join(fail) +
                       "  -- raise SRM2_WARMUP and re-run; do not ship this fit")
          print("sanity OK")
          PY

      - name: Commit the refit
        run: |
          git add -A data/v2_players.csv data/v2_trajectories.csv \
                     data/v2_dyads.csv model/v2_fit_summary.json \
                     data/model_data.csv data/model_players.csv data/model_dyads.csv
          if git diff --cached --quiet; then
            echo "no change — nothing to commit"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "model: weekly v2 refit ($(date -u +%F))"
            git push origin "HEAD:${{ github.ref_name }}" \
              || (git pull --rebase origin "${{ github.ref_name }}" && git push origin "HEAD:${{ github.ref_name }}")
          fi
